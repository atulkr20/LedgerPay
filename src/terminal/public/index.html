<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LedgerPay CLI</title>

  <!-- xterm.js from CDN - this is the terminal emulator -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

  <style>
    /* Make the terminal fill the entire screen */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; }
    #terminal-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script>
    // 1. Create the terminal
    var term = new Terminal({
      cursorBlink: true,
      convertEol: true,       // converts \n → \r\n so lines start at the left edge
      fontSize: 15,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      theme: {
        background: '#0d0d0d',
        foreground: '#f0f0f0',
        cursor: '#00ff88'
      }
    });

    // 2. Fit addon makes terminal resize with the browser window
    var fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // 3. Mount terminal into the div
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    // 4. Connect to our WebSocket server
    //    window.location.host gives us the current domain automatically
    var ws = new WebSocket('ws://' + window.location.host);

    var echoActive = true;

    // 5. When server sends data, write it to the terminal screen
    ws.onmessage = function(event) {
      var data = event.data;
      if (data.indexOf('\x01echo_off\x02') !== -1) {
        echoActive = false;
        data = data.replace(/\x01echo_off\x02/g, '');
      }
      if (data.indexOf('\x01echo_on\x02') !== -1) {
        echoActive = true;
        data = data.replace(/\x01echo_on\x02/g, '');
      }
      term.write(data);
    };

    // 6. When user types, echo it on screen AND send to server
    term.onData(function(data) {
      if (data === '\r') {
        term.write('\r\n');   // Enter — move to next line visually
      } else if (data === '\x7f') {
        term.write('\b \b'); // Backspace — erase the character visually
      } else {
        if (echoActive) {
          term.write(data);    // Normal character — show it on screen
        } else {
          // Masked mode: write '*' only for standard single-character printable inputs
          if (data.length === 1 && data >= ' ' && data <= '~') {
            term.write('*');
          }
        }
      }
      ws.send(data);         // Always forward to the CLI process
    });

    // 6.5 Clipboard Paste Interceptors (Ctrl+V, Cmd+V, Right-Click, and standard paste events)
    
    function handlePasteText(text) {
      if (text) {
        // Strip carriage returns and newlines to prevent auto-submitting or state issues
        var cleanText = text.replace(/[\r\n]+/g, '');
        term.write(cleanText);
        ws.send(cleanText);
      }
    }

    // A. Intercept standard paste events on document level in capture phase
    document.addEventListener('paste', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var text = (e.clipboardData || window.clipboardData).getData('text');
      handlePasteText(text);
    }, true);

    // B. Intercept Ctrl+C / Ctrl+V key combinations
    document.addEventListener('keydown', function(e) {
      // Copy: Ctrl+C or Cmd+C (only if there is active selection in terminal)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
        if (term.hasSelection()) {
          e.preventDefault();
          e.stopPropagation();
          var selection = term.getSelection();
          navigator.clipboard.writeText(selection).catch(function(err) {
            console.error('Ctrl+C clipboard copy failed:', err);
          });
        }
      }
      // Paste: Ctrl+V or Cmd+V
      if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
        e.preventDefault();
        e.stopPropagation();
        navigator.clipboard.readText().then(function(text) {
          handlePasteText(text);
        }).catch(function(err) {
          console.error('Async clipboard read failed:', err);
        });
      }
    }, true);

    // C. Intercept right-clicks for instant PowerShell-style paste
    document.getElementById('terminal-container').addEventListener('contextmenu', function(e) {
      e.preventDefault();
      e.stopPropagation();
      navigator.clipboard.readText().then(function(text) {
        handlePasteText(text);
      }).catch(function(err) {
        console.error('Right-click clipboard read failed:', err);
      });
    }, true);

    // D. Auto-copy on mouse selection (Unix/PuTTY-style copy on highlight)
    term.onSelectionChange(function() {
      if (term.hasSelection()) {
        var selection = term.getSelection();
        navigator.clipboard.writeText(selection).catch(function(err) {
          console.error('Auto-copy selection failed:', err);
        });
      }
    });

    // 7. Resize terminal when window resizes
    window.addEventListener('resize', function() {
      fitAddon.fit();
    });
  </script>
</body>
</html>
